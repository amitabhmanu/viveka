notes: "Exploratory contested case (D-31), not a matched pair: 'pilot' and 'contested' are the nearest values the case schema allows, and no pair prediction attaches to it. Window from the first seed (1998) to the end of the corpus. Two frames: the works citing the seeds, and evolutionary psychology's own journals, so that the community is found among the people who publish there and not only among those who cite this hypothesis. Evolution and Human Behavior is an Elsevier journal and Human Nature a Springer one; how many of their reference lists and citing passages are available is not yet measured. Running the case now means evolutionary psychology can no longer serve as a pre-registered contested case of the framework's validation programme on this hypothesis."
