# Drafted 10 Oct 2026 under decision D-34 (exploratory borderline-pseudoscience cases); awaiting owner review.
format: 1
case: acupuncture-beyond-sham
claim: acupuncture-beyond-sham
role: pilot
pair: contested
window: {start: 1998, end: 2025}
notes: "Exploratory case (D-34), not a matched pair: 'pilot' and 'contested' are the nearest values the case schema allows, and no pair prediction attaches to it. Acupuncture is usually classed as pseudoscience but runs sham-controlled trials and publishes in indexed clinical journals. Window from the first seed (1998) to the end of the corpus. Two frames (owner decision, 10 Oct 2026): the works citing the seeds, and acupuncture's own journals, so that the community is found among the people who publish there and not only among those who cite these papers. Running the case now means acupuncture can no longer serve as a pre-registered case of the framework's validation programme on this claim."
