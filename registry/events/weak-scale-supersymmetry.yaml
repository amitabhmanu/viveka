    kind: disconfirmation
    works: [{openalex: W2173403199, doi: 10.1016/s0370-2693(03)00614-2}]
    note: "LEP combined: no Higgs boson below 114.4 GeV, above the mass minimal supersymmetric models reach without fine-tuning."
    source: "OpenAlex lookup, 8 Oct 2026 (year from the record)."
