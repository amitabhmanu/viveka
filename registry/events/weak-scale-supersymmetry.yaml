format: 1
claim: weak-scale-supersymmetry
wording: "Supersymmetric partners of the known particles exist at or near the weak scale, where they stabilise the Higgs mass against large quantum corrections."
notes: "Contested case, exploratory. The claim is the naturalness form of supersymmetry, the one with a stated revision condition: Barbieri and Giudice (1988, a seed) bounded superpartner masses from above by the fine-tuning they would require. By the community's own practice, searches that could have found superpartners count as support when positive, so null searches count against (framework, principle P). The 125 GeV Higgs (2012) is not listed: it lies inside the range minimal models allow and outside the range they favour without heavy superpartners, so its direction is itself disputed; the direction task labels it like any other bearing result. For owner review: whether the LEP Higgs bound belongs here (it bears on the claim through fine-tuning, the 'little hierarchy problem', not through a direct search), and whether dark-matter direct detection does (it bears on the neutralino, which the community cites as support)."
