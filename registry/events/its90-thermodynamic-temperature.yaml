claim: its90-thermodynamic-temperature
wording: "The International Temperature Scale of 1990 realises thermodynamic temperature within its stated uncertainty, so temperatures measured on ITS-90 need no thermodynamic correction."
notes: "Thermodynamics commitment T1. Primary thermometry (acoustic, and later refractive-index and noise) measures T - T90 directly; the community revised its practice as the differences grew clear."
