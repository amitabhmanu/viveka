# Drafted 10 Oct 2026 under decision D-34 (exploratory borderline-pseudoscience cases); every work verified by OpenAlex lookup.
# Awaiting owner review.

format: 1
claim: acupuncture-beyond-sham
wording: "Needling at traditional acupuncture points produces clinical benefit beyond that of sham needling, such as superficial needling at non-points or non-penetrating needles."
notes: "Exploratory case: the specific-effect claim of acupuncture, chosen because the community cites large trials on both sides and the results against it are dated. The claim is about verum against sham; that acupuncture of either kind does better than no treatment or usual care is not in dispute here and does not bear on it. For owner review: the 2012 individual patient data meta-analysis (Vickers and colleagues) found a small difference from sham and is a seed, while the 2009 BMJ review (Madsen and colleagues) found a difference too small to matter clinically and is an event; whether the German trials (GERAC), where verum and sham did not differ but both beat usual care, are read as disconfirmations is the heart of the dispute."
