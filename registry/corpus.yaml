# Viveka corpus registry (M4a plan, 15 Sep 2026).
# Source: docs/evidence-that-cuts-both-ways.html, instrument registry "Corpus" row and
# "Coverage census"; docs/viveka-harness-spec.html sections 5, 7, 13 and 14.
#
# Sources, API limits and the census conventions shared by every case. Each case's
# own queries live in registry/cases/<case>.yaml, which depends on this file. The
# OpenAlex snapshot is not used: case corpora come from the API within its free
# daily allowance.

version: 0
state: draft

sources:
  - name: openalex
    kind: bibliographic_api
    url: "https://api.openalex.org"
    terms_reference: "https://blog.openalex.org/openalex-api-new-features-and-usage-based-pricing/ (CC0 data; API key and usage-based pricing since 13 Feb 2026; checked 15 Sep 2026)"
  - name: crossref
    kind: bibliographic_api
    url: "https://api.crossref.org"
    terms_reference: "https://www.crossref.org/documentation/retrieve-metadata/rest-api/ (references open by default since 6 Jun 2022; checked 15 Sep 2026)"
  - name: semanticscholar
    kind: citation_contexts
    url: "https://api.semanticscholar.org/graph/v1"
    terms_reference: "https://www.semanticscholar.org/product/api (API license applies; used without a key: unauthenticated requests share a pool of 1000 per second, throttled when busy; checked 16 Sep 2026)"
  - name: manual
    kind: manual
    url: ""
    terms_reference: null
  # Community venues ingested from their own archives (owner decisions D-1 and D-10, 17 Sep 2026).
  - name: crsq
    kind: community_venue
    url: "https://crsq.creationresearch.org"
    terms_reference: "https://crsq.creationresearch.org (Creation Research Society repository; issue and article PDFs free to guests; checked 17 Sep 2026)"
  - name: jom
    kind: community_venue
    url: "https://orthomolecular.org/library/jom"
    terms_reference: "https://orthomolecular.org/library/jom/ (Riordan Clinic archive; articles free of charge as PDFs; checked 17 Sep 2026)"
  - name: arj
    kind: community_venue
    url: "https://answersresearchjournal.org"
    terms_reference: "https://answersresearchjournal.org/about/ (Answers in Genesis; open access online; checked 17 Sep 2026)"
  # Open archives of venues whose publishers deposit no reference lists in Crossref (deposit check, 19 Sep 2026).
  - name: seemj
    kind: community_venue
    url: "https://journals.holosuniversity.org/index.php/seemj"
    terms_reference: "https://journals.holosuniversity.org/index.php/seemj/about (Subtle Energies & Energy Medicine Journal Archives: static open archive of volumes 1-21, 1990-2011, PDFs free; checked 19 Sep 2026)"
  - name: bioc
    kind: community_venue
    url: "https://bio-complexity.org/ojs/index.php/main"
    terms_reference: "https://bio-complexity.org (BIO-Complexity, Biologic Institute; open access, PDFs free; checked 19 Sep 2026)"
  - name: ijhdr
    kind: community_venue
    url: "https://highdilution.org/index.php/ijhdr"
    terms_reference: "https://highdilution.org/index.php/ijhdr (International Journal of High Dilution Research, GIRI; open access on OJS, PDFs free; checked 19 Sep 2026)"
  - name: ijrh
    kind: community_venue
    url: "https://www.ijrh.org/journal"
    terms_reference: "https://www.ijrh.org (Indian Journal of Research in Homoeopathy, CCRH; CC BY-NC-SA 4.0, PDFs free; checked 19 Sep 2026)"
  # The ICCF proceedings, cold fusion's second community frame (decision D-8, before M5 eligibility).
  - name: iccf
    kind: community_venue
    url: "https://lenr-canr.org"
    terms_reference: "https://lenr-canr.org (LENR-CANR.org library: papers 'reprinted with permission from the authors and publishers', free PDFs; a full EndNote export of the library at /EndNoteExport.txt; robots.txt disallows only admin, plugin, feed and index paths; checked 19 Sep 2026)"

api:
  openalex:
    daily_usd_cap: 0.80            # below the $1 free daily allowance; paid credit needs decision D-6
    prices_usd: {singleton: 0.0, list: 0.0001, search: 0.001, content: 0.01}
    requests_per_second: 5
    per_page: 200
    doi_batch: 50                  # DOIs per OR filter
  crossref:
    requests_per_second: 5         # polite pool, with contact email
  semanticscholar:
    requests_per_second: 1         # introductory authenticated limit, with a key
    keyless_requests_per_second: 0.2  # without a key: the public pool is shared and throttled, so stay well below it
    page_size: 1000
    max_offset: 10000              # offset + limit must stay below this

census:
  works_per_year: 10               # sampled per frame and publication year
  max_unmeasured_share: 0.5        # above it, coverage is not measurable for that frame or year
  seed: 20260915
  resolution: crossref_doi_plus_sampled_biblio_match
  # A reference with a Crossref-deposited or Crossref-matched DOI resolves when the DOI is in OpenAlex.
  # References without a DOI are sampled per work and matched in OpenAlex by year (± tolerance), volume
  # and first page, with the journal name breaking ties; the matched share estimates the rest of that
  # frame-year's DOI-less references. A reference whose year, volume and page cannot be read counts as unmatched.
  doiless_sample_per_work: 3
  match_year_tolerance: 1
  # Only research papers count (user decision, 16 Sep 2026): proceedings are kept because communities publish
  # there. Frame works of other OpenAlex types are excluded before sampling; references to books, theses,
  # reports, preprints, web pages and unpublished work are excluded by the registered classifier, and
  # references too sparse to classify are excluded and counted separately.
  paper_types: [article, review, letter, conference-paper]
  reference_classification: crossref_fields_v1
  # A sampled DOI-less paper reference that volume and page do not match is queried once with Crossref's
  # bibliographic matcher (free), to recover papers cited with a wrong volume, page or year. A candidate is
  # accepted only if it is a journal article or proceedings paper scoring at least min_score, published within
  # the year tolerance when both years are known, and either shares title_word_share of its title's words with
  # the citation or agrees on volume, first page or journal; its DOI must then be a paper in OpenAlex.
  # Rule v2 (after an audit of 15 accepted recoveries found 5 false matches): candidates are also rejected when
  # the citation is to proceedings and the candidate is a journal article elsewhere, when volume and page both
  # contradict the citation (unless the title matches strongly), and when the title has fewer than five words
  # or, for a citation with its own title, does not match both ways.
  bibliographic_rescue:
    rule: crossref_bibliographic_v2
    min_score: 40
    title_word_share: 0.8

# Calibration field selection (decision D-10, owner approved 17 Sep 2026), fixed before any calibration census.
# Folds are whole fields, so calibration fields must be distinct communities. Before the census, the overlap
# between any two calibration fields, and between a field and a pilot or reserve case, is measured on the
# authors of the works in their community frames (a case's mainstream citing frame is not a community under
# calibration), from their latest fetches in the same fold: the number of authors two subjects share divided by
# the smaller one's number of authors (the
# overlap coefficient, which Jaccard would understate for a small field inside a large one). Only core
# authors count: those with at least core_min_works works in the subject's community frames. Two subjects
# whose community works all come from OpenAlex are compared by OpenAlex author id; otherwise both are
# compared by folded family name and every initial. Above max_overlap, the smaller field is dropped and
# recorded. Rule v2 (owner, 18 Sep 2026) replaced v1, which compared every author by family name and first
# initial: in the dev fold a third of any small field's names matched namesakes in immunology's 156,000.
calibration_selection:
  overlap_measure: overlap_coefficient_core_v2
  max_overlap: 0.2
  core_min_works: 2

# Social layer (stage S3; M5 plan, owner 19 Sep 2026), fixed before any clusters are seen. The framework
# locates communities in the network of researchers (R1) from co-authorship and citation ties.
#   coauthor_citation_v1: nodes are the authors of the case's works published in a sub-window, by OpenAlex
#     author id; when the case has ingested works, whose authors are known only by name, every author is keyed
#     by folded family name and first initial, so one person is one node whichever venue a paper came from
#     (ingested works have no citation data, so they add co-authorship ties only). Each work with k >= 2 authors adds
#     1/(k-1) to every pair of its authors; each citation from a work in the sub-window to another corpus work
#     adds 1/(a*b) to every pair of a citing and a cited author (a and b authors) who are both active in the
#     sub-window. Ties are undirected; self-ties are dropped. Shared venues and institutions are not used: the
#     corpus holds each case's frames, not every venue its authors publish in.
#   Sub-windows are w years stepped yearly (thresholds: w and its variants). Leiden (modularity with a
#   resolution, leidenalg's RBConfigurationVertexPartition) runs at every sweep resolution to convergence
#   from leiden_seed. The hierarchical block model (the sweep's second method) needs graph-tool, which has no
#   Windows build: until a runtime exists every S3 and S4 output is provisional (decision D-1, 19 Sep 2026).
#   Lineages link clusters of at least lineage_min_members authors across consecutive sub-windows by Jaccard
#   overlap of at least o (thresholds), each successor keeping its best-linked predecessor; a cluster with two
#   successors branches. S4 takes its go/replace at primary_resolution and reports every other resolution.
#   bearing_results_v1 (D-13, 19 Sep 2026; post hoc, after the registered pilot-fold S4 under v3): S4's count
#     against v is the number of distinct results bearing on p that a lineage's works cite in the sub-window,
#     the quantity v was simulated for (the simulator's citations_on_claim). Before any coding the results
#     bearing on p are the seeds, the event works and every corpus work that cites one of them. Under v3, S4
#     counted only citations to the seeds and event works, which is not what v measures.
social:
  graph: coauthor_citation_v1
  leiden_seed: 20260919
  lineage_min_members: 2
  primary_resolution: 1.0
  bearing_results: bearing_results_v1

# Community venues that OpenAlex does not index, ingested from their own archives (framework corpus row:
# "each community's own venues ingested directly"; owner decision D-1, 17 Sep 2026: no GROBID, text layers
# only, with a hand audit). An adapter lists each venue's papers as works with local ids X:<venue>:<key>
# and authors by name; a paper's document is fetched only when the census samples it. Every response is
# archived like the API responses, so a run replays exactly.
#   pypdf_text_v1: a PDF's text layer as pypdf extracts it; a web page's text. No OCR: a document without
#     text has no reference list, and its work is unmeasured.
#   reference_section_v1: the list after the last "References" (or "Literature cited", "Bibliography",
#     "Works cited") heading, to an appendix or about-the-author heading or, in a web page, the next heading;
#     one reference per paragraph in a web page, and in PDF text a new reference at a line opening with a
#     number, an author or a lost ditto rule after a finished sentence. A DOI, year, journal, volume and first
#     page are read from each reference's text; classification and matching then follow the census rules.
#   reference_section_v2 (19 Sep 2026): as v1, and also accepts "References and notes" and "Notes and
#     references" as headings; for PDF text with no heading, the list is the last numbered run starting at "1."
#     that continues "2.", "3." within 30 lines with a year in each of its first three entries, and lines that
#     recur three or more times in the document (running titles, footer DOIs) are dropped from it. Adopted after
#     the first BIO-Complexity and Subtle Energies censuses found their lists unread (no heading in the text
#     layer; a "References and notes" heading). Documents with a v1 heading extract as before.
#   ingested_catalogue_v1: before OpenAlex, a sampled DOI-less paper reference is matched against the listed
#     papers of the subject's ingested venues: its journal must be one of the venue's aliases, its volume
#     equal, its year within the census year tolerance, and either its first page equal or, when the listing
#     has no page, the listed paper's first author's family name must open the reference.
#   audit_references: the ingestion audit (decision D-1) checks this many extracted references, drawn at random
#     over the references of a census run's sampled ingested papers, by hand against their documents, together
#     with each of their papers' true reference counts; the census report states the verdict counts.
# Venue types map the archive's item type or contents-page section to a work type; the census counts only
# the registered paper types, so editorials, reviews of books and obituaries are excluded and counted.
ingestion:
  requests_per_second: 0.5
  text_extraction: pypdf_text_v1
  reference_extraction: reference_section_v2
  catalogue_match: ingested_catalogue_v1
  audit_references: 60
  venues:
    crsq:
      name: Creation Research Society Quarterly
      issn_l: "0092-9166"
      adapter: eprints_json_v1
      url: "https://crsq.creationresearch.org"
      aliases: [CRSQ, Creation Research Society Quarterly, Creation Research Soc. Quarterly]
      types: {article: article}
      default_type: other
      note: "The repository holds research articles with their PDFs; departments (letters, notes) are not deposited, so they are outside the frame and not counted."
    jom:
      name: Journal of Orthomolecular Medicine
      issn_l: "0834-4825"
      adapter: orthomolecular_toc_v2
      url: "https://orthomolecular.org/library/jom"
      aliases: [Journal of Orthomolecular Medicine, J Orthomol Med, J. Orthomol. Med, J. Orthomolecular Med, J Orthomolecular Med]
      # Contents-page anchors -> work types. "classic" sections reprint older papers, so they are not counted.
      types: {articles: article, case: article, center: article, correspondence: letter, letters: letter, editorial: editorial, memoriam: other, mem: other, books: other, book: other, news: other, isom: other, classic: other}
      default_type: other
      note: "The online archive runs from 1986 to 2009 (year pages from 2010 return not found, checked 17 Sep 2026), so the frame ends in 2009; a few issues' contents pages are missing or empty (1991 no. 3 and 4, 2003 no. 4, 2009 no. 4)."
    arj:
      name: Answers Research Journal
      issn_l: "1937-9056"
      adapter: arj_volumes_v1
      url: "https://answersresearchjournal.org"
      aliases: [Answers Research Journal, ARJ]
      default_type: article
      first_volume_year: 2008
      note: "Every item in a volume is a peer-reviewed paper or a comment and reply on one."
    # Section titles decide work types: exact names in types, else the first matching pattern, else default_type.
    seemj:
      name: Subtle Energies & Energy Medicine
      issn_l: "1099-6591"
      adapter: ojs_v1
      url: "https://journals.holosuniversity.org/index.php/seemj"
      aliases: [Subtle Energies & Energy Medicine, Subtle Energies and Energy Medicine, Subtle Energies, Subtle Energ Energy Med]
      type_patterns: {"cover|contents|index|announcement|news|obituar|memoriam|book review|errat": other, "editorial": editorial, "letter|correspondence|comment|reply": letter}
      default_type: article
      note: "No DOIs; OpenAlex source S2764506119 lists part of the run without reference lists. Articles without a PDF galley have no document."
    bioc:
      name: BIO-Complexity
      issn_l: "2151-7444"
      adapter: ojs_v1
      url: "https://bio-complexity.org/ojs/index.php/main"
      aliases: [BIO-Complexity, Bio-Complexity, BIO-C]
      type_patterns: {"editorial": editorial, "book review|errat|announcement": other}
      default_type: article
    ijhdr:
      name: International Journal of High Dilution Research
      issn_l: "1982-6206"
      adapter: ojs_v1
      url: "https://highdilution.org/index.php/ijhdr"
      aliases: [International Journal of High Dilution Research, Int J High Dilution Res, Int. J. High Dilution Res, IJHDR]
      type_patterns: {"meeting|abstract|proceedings|congress|symposium|workshop": other, "editorial": editorial, "cover|contents|index|announcement|news|obituar|memoriam|book review|errat": other, "letter|correspondence|comment|reply": letter}
      default_type: article
      note: "Meeting-abstract issues (GIRI proceedings) are typed other: short abstracts without reference lists."
    ijrh:
      name: Indian Journal of Research in Homoeopathy
      issn_l: "0974-7168"
      adapter: bepress_v1
      url: "https://www.ijrh.org/journal"
      aliases: [Indian Journal of Research in Homoeopathy, Indian J Res Homoeopathy, Indian J. Res. Homoeopathy, IJRH]
      type_patterns: {"editorial": editorial, "book review|errat|announcement|news|obituar": other, "letter|correspondence|comment|reply": letter}
      default_type: article
    # endnote_v1 (decision D-8, 19 Sep 2026): the records of LENR-CANR's EndNote export whose proceedings title
    # (%B) matches record_pattern, up to last_year. ICCF-16 onward (2011-) were published as volumes of the
    # Journal of Condensed Matter Nuclear Science, already cold fusion's first community frame, so they are
    # left to it rather than counted twice. A PDF of one paper is used whole (a #page= fragment only skips a
    # cover page); in a whole-volume PDF linked from several records, a paper reads from its start page to the
    # page before the next paper's, and a record there without a start page has no document (unmeasured).
    iccf:
      name: Proceedings of the International Conference on Cold Fusion (ICCF)
      issn_l: null
      adapter: endnote_v1
      url: "https://lenr-canr.org/EndNoteExport.txt"
      record_pattern: "conference on cold fusion|conference on condensed matter nuclear science|\\bICCF"
      last_year: 2009
      aliases: [ICCF, Proceedings of ICCF, International Conference on Cold Fusion, Conference on Cold Fusion,
                International Conference on Condensed Matter Nuclear Science, "Proc. ICCF", "The Science of Cold Fusion",
                "Frontiers of Cold Fusion", Progress in New Hydrogen Energy, Condensed Matter Nuclear Science]
      types: {"Conference Proceedings": conference-paper, "Conference Paper": conference-paper}
      default_type: other
