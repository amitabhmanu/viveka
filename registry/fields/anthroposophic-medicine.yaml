notes: "Added from the pseudoscience candidates: the only candidate with a community venue in OpenAlex. A single German-language venue. Qualifying evidence for the selection rule (D-10 point 1, original rule: a national scientific body), accepted by the owner on 4 Oct 2026: the Royal Swedish Academy of Sciences' consultation response of 23 Aug 2017 on 'Vissa ändringar i läkemedelslagen', supporting the removal of the Medicines Act's exemption for anthroposophic products because 'the concepts of anthroposophy and medicines are incompatible, since anthroposophy rejects science while medicines presuppose science and proven experience' (kva.se, read 3 Oct 2026), after its 2015 response that incorporating the products 'contradicts several fundamental principles for medicines and evidence-based healthcare'; the Swedish government ended the exemption (phased out from 2016, gone by Sept 2019). On record against: Switzerland covers anthroposophic medicine under mandatory insurance (permanently since 2017, after a 2009 referendum; the federal evaluation programme PEK was inconclusive in 2005) and the HTA commissioned within PEK (Kienle et al. 2006) was favourable. The same Swiss coverage applies to homeopathy and did not bar it, so the two are treated alike; the judgement is on anthroposophic medicinal products and is less clear-cut than homeopathy's. Until 4 Oct 2026 this field was parked for want of a judgement. Author overlap with homeopathy is to be measured."
