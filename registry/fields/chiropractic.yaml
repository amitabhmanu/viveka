notes: "Candidate added under D-14 (owner, 19 Sep 2026) as a pseudoscience community large enough for gate 1, if the size bounds allow. The commitment in question is vertebral subluxation theory: the chiropractic subluxation as a cause of disease. Qualifying evidence for the selection rule (D-10, point 1): the UK General Chiropractic Council, the statutory regulator, stated in May 2010 that the chiropractic vertebral subluxation complex is an historical concept not supported by any clinical research evidence that would allow claims that it is the cause of disease or health concerns. The venues serve the whole chiropractic profession, in which evidence-based practitioners and subluxation-based practitioners publish side by side; the social layer is expected to separate them into lineages, and whether this counts as a venue devoted to the community (D-10, point 2) is for the owner's review."
