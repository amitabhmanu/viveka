[project]
name = "viveka"
version = "0.1.0"
description = "Research harness for the evidential-symmetry demarcation framework"
authors = [
    { name = "Amitabh", email = "amitabhmanu@yahoo.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.20",
    "numpy>=1.26",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
]

[project.scripts]
viveka = "viveka.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow and not live'"
markers = [
    "slow: grid-scale simulation tests; run with -m slow",
    "live: calls real data sources (needs keys in .env); run with -m live",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
