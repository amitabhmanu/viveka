[project]
name = "viveka"
version = "0.1.0"
description = "Research harness for the evidential-symmetry demarcation framework"
authors = [
    { name = "Amitabh", email = "amitabhmanu@yahoo.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
viveka = "viveka.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
